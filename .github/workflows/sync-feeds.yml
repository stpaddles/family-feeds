name: Sync calendars

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours at :17 (UTC)
  workflow_dispatch: {}       # "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download feeds
        run: |
          set -u
          mkdir -p cal
          UA="Mozilla/5.0 (family-calendar-sync)"
          fetch () {
            name="$1"; url="$2"
            if curl -fsSL --retry 3 --max-time 60 -A "$UA" "$url" -o "cal/$name.tmp" \
               && grep -q "BEGIN:VCALENDAR" "cal/$name.tmp"; then
              mv "cal/$name.tmp" "cal/$name"
              echo "ok   $name"
            else
              rm -f "cal/$name.tmp"
              echo "FAIL $name (kept previous copy)"
            fi
          }
          fetch gtcys-phil-east.ics  "https://gtcys.org/?post_type=tribe_events&ical=1&eventDisplay=list&tribe_events_cat=phil-east"
          fetch gtcys-cam-vivace.ics "https://gtcys.org/?post_type=tribe_events&ical=1&eventDisplay=list&tribe_events_cat=cam-vivace"
          fetch mmsa-school.ics      "https://calendar.google.com/calendar/ical/mmsaschool.org_doi91mkcp0puqcqhvkbm6ufovs%40group.calendar.google.com/public/basic.ics"
          fetch hm-pioneer-band.ics  "https://calendar.google.com/calendar/ical/hmpioneerband%40gmail.com/public/basic.ics"
          date -u +%Y-%m-%dT%H:%M:%SZ > cal/last-sync.txt

      - name: Commit if changed
        run: |
          git config user.name  "calendar-sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git add cal/*.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git add cal/last-sync.txt
            git commit -m "Sync calendars"
            git push
          fi
